<ui:composition  template="/WEB-INF/template/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
    
    <ui:define name="title">
        SEGUNDUM
    </ui:define>
    
    <!-- Formulario -->
    <ui:define name="content">
        <h:form id="loginForm">
            <p:messages id="msgs" showDetail="true" closable="true"/>
            <p:panel header="Acceso" style="width:320px;margin:100px auto;">
                <p:panelGrid columns="2" columnClasses="etiqueta,valor" styleClass="ui-fluid" style="width:100%;">
                    <h:outputLabel for="email" value="Email:" />
                    <p:inputText id="email"
                                 value="#{altaSegundumWeb.email}"
                                 required="true"
                                 requiredMessage="El email es obligatorio."
                                 invalidMessage="El email no tiene un formato válido."
                                 label="Email">
                        <f:validateRegex pattern="[^\s@]+@[^\s@]+\.[^\s@]+" />     <!-- forma: hola@loquesea.loquesea -->
                    </p:inputText>

                    <h:outputLabel for="password" value="Contraseña:" />
                    <p:password id="password"
                                value="#{altaSegundumWeb.password}"
                                required="true"
                                feedback="false"
                                requiredMessage="La contraseña es obligatoria."
                                label="Contraseña" />
                </p:panelGrid>
                <p:separator/>
                <p:commandButton value="Entrar"
                                 action="#{altaSegundumWeb.login}"
                                 update=":loginForm:msgs"
                                 icon="pi pi-sign-in"
                                 styleClass="ui-button-success"
                                 style="width:100%;"/>
            </p:panel>
        </h:form>
    </ui:define>

</ui:composition>
