server.port=8090
spring.application.name=pasarela

zuul.sensitiveHeaders=

zuul.routes.usuarios.path = /usuarios/**
zuul.routes.usuarios.url = http://usuarios:8080/api/usuarios

zuul.routes.productos.path = /productos/**
zuul.routes.productos.url = http://productos:8081/productos

zuul.routes.categorias.path = /categorias/**
zuul.routes.categorias.url = http://productos:8081/categorias

zuul.routes.compraventas.path = /compraventas/**
zuul.routes.compraventas.url = http://compraventas:8082/api/compraventas

jwt.secret=***REMOVED***
jwt.expiration-seconds=3600
jwt.cookie-name=jwt

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
